<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Fundo Bege Oficial WhatsApp -->
  <rect width="400" height="400" fill="#efeae2"/>
  
  <g stroke="#d5cecf" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
